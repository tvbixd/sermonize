<!--
  Scribe — sign-in code email.
  Paste this into Supabase → Authentication → Email Templates → Magic Link.
  {{ .Token }} is replaced by Supabase with the 6-digit one-time code.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f2f7;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background:#0A84FF;padding:28px 32px;">
            <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.5px;">Scribe</span>
          </td>
        </tr>
        <tr>
          <td style="padding:36px 32px 8px;">
            <h1 style="margin:0 0 8px;font-size:20px;color:#2b3031;font-weight:700;">Your sign-in code</h1>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#7a7e80;">
              Enter this code in the app to finish signing in. It expires in a few minutes.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 32px 8px;">
            <div style="background:#f2f2f7;border-radius:12px;padding:20px;">
              <span style="font-size:34px;font-weight:700;letter-spacing:8px;color:#0A84FF;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</span>
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 36px;">
            <p style="margin:0;font-size:13px;line-height:1.6;color:#b8babb;">
              If you didn't request this code, you can safely ignore this email — no one can sign in without it.
            </p>
          </td>
        </tr>
      </table>
      <p style="margin:20px 0 0;font-size:12px;color:#b8babb;">Scribe — sermon notes, hands-free</p>
    </td>
  </tr>
</table>
